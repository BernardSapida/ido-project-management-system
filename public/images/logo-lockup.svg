<!--
  A LAB FIXTURE, not a brand asset. It exists so the site-header lab has a real
  horizontal lockup to size, because the template's own logo.png is 472x432 -
  near-square, so it cannot show the failure this demonstrates.

  256x76 is roughly the aspect ratio a supplied brand lockup arrives at, and it
  is the ratio that breaks: dropped into AppLogo's square 40x40 mark slot,
  object-contain paints it at 40x12.

  The ink is a LITERAL, not currentColor. An <img> is a replaced element and does
  not inherit colour from the page, which is the whole reason AppLogo grew a
  `src` prop instead of a `tone` that could recolour this - see logo-lockup-light.svg.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 76" width="256" height="76" role="img" aria-label="Lockup">
  <circle cx="34" cy="38" r="24" fill="none" stroke="#1f3d34" stroke-width="7" />
  <circle cx="34" cy="38" r="8" fill="#1f3d34" />
  <text x="76" y="50" font-family="ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700" letter-spacing="-0.5" fill="#1f3d34">LOCKUP</text>
</svg>
